# 100k-events/run PRODUCTION scale-up (2026-07-14, user-approved): 4 nodes x
# 32 runs/node, runs 1-128 (run 0 = 10k pilot, untouched). Topology validated by
# the debug topotest (16x8, commit 9222ef4 SLURM-env fix). Verbatim pilot physics.
# Particle Gun — Single Muons, uniform pt in [1, 110] GeV
# Campaign: drift_beamspot (uniform drifting beamspot + tracker-only geometry)
campaign: "drift_beamspot"
dataset: "single_muon_uniform"
version: "v1"
stage: "particlegun_generation"

common:
  container: "ghcr.io/opendatadetector/sw:pr-8"
  container_tarball: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/stress_mu200/sw_pr8_image.tar"

job_config:
  n_runs: 128
  runs_per_node: 32
  time_limit: "00:30:00"
  qos: "debug"
  execution_mode: "multi_node_slurm"

events: 1000000         # per run; campaign final = 100M
seed: 42

particle: "mu-"
energy_min: 1.0
energy_max: 110.0
log_uniform: false     # flat (uniform) in pt
transverse: true

eta_min: -3.0
eta_max: 3.0
phi_min: 0.0
phi_max: 6.28318530718

vertex_uniform: true
vertex_min: [-5.0, -5.0, -200.0, -0.32]
vertex_max: [ 5.0,  5.0,  200.0,  0.32]

splitting_config:
  enable: false
  n_runs: 1

# PILOT digitization + parquet on the newly simulated muons (2026-08-17).
# 2 nodes x 32 runs/node = 64 runs, ADDITIVE on runs 129-192 (--run-range 129 193).
# Those runs hold only edm4hep.root + events.hepmc3 today; verified zero digi
# outputs present, so nothing is overwritten. Runs 0-128 are NOT touched.
#
# Body is the proven digitization_config_100k.yaml. Deviations, all deliberate:
#   job_config : n_runs 128 -> 64, qos regular -> debug, time_limit 2h -> 30m
#   common     : + cache_dir (the previous digi run had all 128 tasks download
#                ~2 GB of Geant4 data each; that is what collapsed simulation at
#                1888 tasks, so point at the pre-populated CFS cache)
#   NEW        : truth_tracking + parquet shard/row-group keys (this is what the
#                pilot exists to exercise)
#
# Header note: the 100k config's title said "Single Muons 10 GeV" - wrong, this
# dataset is uniform pt in [1, 110] GeV. Corrected here.
#
# Digitization + tracking - Single Muons, uniform pt (tracker-only)
# Reads the sim edm4hep.root, runs ACTS digitization -> seeding -> CKF tracking ->
# ambiguity resolution, writes measurements + tracks. Uses the ODD v6.0.2 geometry that
# matches the tracker-only sim (ACTS tracking geometry is the tracker either way).
campaign: "drift_beamspot"
dataset: "single_muon_uniform"
version: "v1"
stage: "digitization"

common:
  container: "ghcr.io/opendatadetector/sw:pr-8"
  container_tarball: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/stress_mu200/sw_pr8_image.tar"
  cache_dir: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/software/colliderml-prod-container/.cache"

job_config:
  n_runs: 64
  runs_per_node: 32
  time_limit: "00:30:00"
  qos: "debug"
  execution_mode: "multi_node_slurm"

events: 100000
threads: 8

# ACTS geometry/material/digi configs: /opt/odd in sw:pr-4 holds xml/ + config/ + data/
# (material map) for ODD v6.0.2. Read by digi_and_reco (config.odd_geo_dir).
odd_geo_dir: /opt/odd
digi_config: /opt/odd/config/odd-digi-geometric-config.json

output_parquet_arrow: True   # native ACTS parquet: tracker_simhits + tracker_hits + particles + tracks
digi: True
reco: True
num_seeds_per_spm: 40

# --- NEW: truth-found tracks, written as a `truth_tracks/` table beside `tracks/`.
# Truth decides only which hits belong to which particle; the fit is seeded by a
# GX2F pre-fit over those hits (material effects on), never by truth kinematics.
truth_tracking: true
truth_tracking_fitter: kf
truth_tracking_prefit: gx2f

# --- NEW: one parquet file per table per run instead of 100.
# Row group stays small on purpose: it bounds the in-memory write buffer, and
# letting it follow the shard would buffer a whole run's worth of tables.
# Measured on 5000 muon events: row group 100 -> 1.09 GB, 5000 -> 1.93 GB peak RSS.
parquet_events_per_shard: 100000
parquet_events_per_row_group: 1000

# Output writers
output_particles_root: True
output_measurements_root: True
ambi_root_output: True
ambi_finding_performance: True
ambi_fitting_performance: True
write_helix_parameters: True

# Seed acceptance widened for this campaign: the gun spreads vertices uniformly
# over +-5 mm transverse, so |d0| reaches 7.1 mm. At the benchmark 3 mm the CKF
# efficiency is 0.97 within 2 mm but 0.09 at 5 mm; at 8 mm it is flat at ~0.96
# with no rise in fakes (pilot 2026-09-12). hard_scatter/full_pileup keep 3 mm
# via the code default.
seed_impact_max: 8.0

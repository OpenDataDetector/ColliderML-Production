# 200M PRODUCTION scale-up (2026-08-14, user-approved): 59 nodes x 32 runs/node,
# ADDITIVE runs 129-2016 (--run-range 129 2017). Runs 0-128 (the 12.81M already on
# disk) are NOT touched. 1888 x 100k = 188.8M new -> 201.6M total.
# Body is verbatim from particlegun_config_100k.yaml. Only three fields differ:
#   n_runs 128 -> 1888, qos debug -> regular (debug caps at 8 nodes), and
#   time_limit 00:30:00 -> 00:45:00 (headroom for 59-node podman image load).
# Particle Gun — Single Muons, uniform pt in [1, 110] GeV
# Campaign: drift_beamspot (uniform drifting beamspot + tracker-only geometry)
campaign: "drift_beamspot"
dataset: "single_muon_uniform"
version: "v1"
stage: "particlegun_generation"

common:
  container: "ghcr.io/opendatadetector/sw:pr-8"
  container_tarball: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/stress_mu200/sw_pr8_image.tar"

job_config:
  n_runs: 1888
  runs_per_node: 32
  time_limit: "00:45:00"
  qos: "regular"
  execution_mode: "multi_node_slurm"

events: 100000         # per run; campaign final = 200M
seed: 42

particle: "mu-"
energy_min: 1.0
energy_max: 110.0
log_uniform: false     # flat (uniform) in pt
transverse: true

eta_min: -3.0
eta_max: 3.0
phi_min: 0.0
phi_max: 6.28318530718

vertex_uniform: true
vertex_min: [-5.0, -5.0, -200.0, -0.32]
vertex_max: [ 5.0,  5.0,  200.0,  0.32]

splitting_config:
  enable: false
  n_runs: 1

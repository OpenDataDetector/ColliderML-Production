# 100k single-run scale-up to the campaign final (2026-07-15): run 1 additive
# alongside the 10k pilot run 0. Recipe validated by the 12.8M uniform pilot.
# Particle Gun — Single Muons, fixed pt = 100 GeV
# Campaign: drift_beamspot (uniform drifting beamspot + tracker-only geometry)
campaign: "drift_beamspot"
dataset: "single_muon_100GeV"
version: "v1"
stage: "particlegun_generation"

common:
  container: "ghcr.io/opendatadetector/sw:pr-8"
  container_tarball: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/stress_mu200/sw_pr8_image.tar"

job_config:
  n_runs: 1
  runs_per_node: 1
  time_limit: "00:30:00"
  qos: "debug"
  execution_mode: "multi_node_slurm"

events: 100000         # campaign final for this bin
seed: 42

particle: "mu-"
energy_min: 100.0
energy_max: 100.0
log_uniform: false
transverse: true

eta_min: -3.0
eta_max: 3.0
phi_min: 0.0
phi_max: 6.28318530718

vertex_uniform: true
vertex_min: [-5.0, -5.0, -200.0, -0.32]
vertex_max: [ 5.0,  5.0,  200.0,  0.32]

splitting_config:
  enable: false
  n_runs: 1

# Merge & smear — ttbar — applies the UNIFORM drifting-beamspot vertex (no pileup -> smear-only)
# Reads events.hepmc (from madgraph_generation), translates every event's vertices by a
# uniformly-sampled offset (ACTS UniformVertexGenerator), writes merged_events.hepmc3.
campaign: "drift_beamspot"
dataset: "ttbar"
version: "v1"
stage: "merge_smear"

common:
  container: "ghcr.io/opendatadetector/sw:pr-8"
  container_tarball: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/stress_mu200/sw_pr8_image.tar"

job_config:
  # Scale-up from the 6-run pilot: 32 runs/node matches the packing proven across
  # the muon campaign (2017-run digi, 1888-run sim). merge is single-threaded and
  # light (one 151MB hepmc per run). regular qos: 774 runs / 32 = 25 nodes,
  # above debug's 8-node cap.
  n_runs: 774
  runs_per_node: 32
  time_limit: "00:30:00"
  qos: "regular"
  execution_mode: "multi_node_slurm"

seed: 42
input_filename: events.hepmc      # signal produced by madgraph_generation (no pileup)

# Uniform "drifting beamspot" production vertex (x,y,z in mm; t in ns)
vertex_uniform: true
vertex_min: [-5.0, -5.0, -200.0, -0.32]
vertex_max: [ 5.0,  5.0,  200.0,  0.32]


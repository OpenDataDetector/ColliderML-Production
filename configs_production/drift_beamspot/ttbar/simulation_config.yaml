# DDSim simulation — ttbar — TRACKER-ONLY geometry (calo + muon OFF)
# Vertex is applied at the GENERATION stage (ACTS UniformVertexGenerator), so ddsim does
# NO smearing here: vertexSigma = 0.
campaign: "drift_beamspot"
dataset: "ttbar"
version: "v1"
stage: "simulation"

common:
  container: "ghcr.io/opendatadetector/sw:pr-8"
  container_tarball: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/stress_mu200/sw_pr8_image.tar"
  cache_dir: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/software/colliderml-prod-container/.cache"

job_config:
  # 6/node: the ttbar-pilot-proven packing. 32/node (proven for MUONS only) caused
  # a synchronized mass failure in job 57452905: ~709 tasks died ~30 min in leaving
  # corrupt ~88MB edm4hep files with no readable trees, while two nodes that
  # serialized their tasks produced complete 414MB files. Root cause not fully
  # pinned (no OOM messages; MaxRSS accounting inconclusive under podman) - but
  # 6/node is proven and ttbar events are ~5x heavier than muons. Do not re-raise
  # without an instrumented single-node test.
  n_runs: 748
  runs_per_node: 16
  time_limit: "03:00:00"
  qos: "regular"
  execution_mode: "multi_node_slurm"

events: 1280
threads: 8
input_filename: merged_events.hepmc3   # output of the merge_smear stage (vertex-smeared)
minimalKineticEnergy: 0.1
truthParticleHandler: "Geant4FullTruthParticleHandler"

# No ddsim vertex smearing — the uniform drifting beamspot is applied in the merge_smear stage.
vertexOffset: [0.0, 0.0, 0.0, 0.0]
vertexSigma:  [0.0, 0.0, 0.0, 0.0]

# Tracker-only geometry: ODD v6.0.2 staged build (Defs + Tracker only).
odd_compact_files:
  - /opt/odd-install/share/OpenDataDetector/xml/OpenDataDetectorDefs.xml
  - /opt/odd-install/share/OpenDataDetector/xml/OpenDataDetectorTracker.xml
  - /global/cfs/cdirs/m4958/usr/danieltm/ColliderML/software/colliderml-prod-container/configs_production/drift_beamspot/geometry/tracker_fields_plugins.xml

# Note: ttbar produces split run dirs (runs/0, runs/1, ...). Point debug_output_dir at the
# run to simulate, or run in multi_node mode for the full set.

# Log hygiene, adopted from the standard hard_scatter ttbar config (its 1000-run
# campaign): FATAL-only ddsim prints + shell-level G4Exception filtering.
ddsim_printLevel: 6
filter_g4_warnings: true

# MadGraph generation — ttbar (NLO FxFx) — uniform drifting beamspot
# Campaign: drift_beamspot.
# WARNING: the copied hard_scatter/ttbar/v1 madgraph_process.tgz is built against the HOST
# MG5 toolchain (OtherLibraries/MG5_aMC_v3_5_8) and is NOT usable in the sw container image
# (FastJet ABI mismatch: needs PseudoJet::operator= which image fastjet 3.5.0 doesn't export;
# plus CutTools compiler mismatch). The process MUST be regenerated in-image via madgraph_init
# before this stage will run in pr-8. Proven recipe (LO+NLO) generates fresh with the image's
# own MG5 3.5.9. Do NOT assume "skip madgraph_init by reusing the tarball" works across images.
campaign: "drift_beamspot"
dataset: "ttbar"
version: "v1"
stage: "madgraph_generation"

common:
  container: "ghcr.io/opendatadetector/sw:pr-8"
  container_tarball: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/stress_mu200/sw_pr8_image.tar"

job_config:
  n_runs: 1
  runs_per_node: 1
  time_limit: "01:00:00"
  qos: "interactive"
  execution_mode: "interactive"

events: 10000          # pilot; final = 1000000 (scale n_runs in multi_node mode)
seed: 42

mg_base_path: "{madgraph.mg_base_path}"
generation_scratch_dir: "{madgraph.generation_scratch_dir}"

# NOTE: the uniform drifting-beamspot vertex is applied in a SEPARATE merge_smear stage
# (see merge_smear_config.yaml), not here. Generation produces events at the origin.

card_customizations:
  run_card:
    "ptj": 20.0
    "event_norm": "sum"
  shower_card:
    "Qcut": 40.0
    "time_shower_me_corrections": "F"

splitting_config:
  enable: true
  events_per_file: 1280
  max_files_per_mg_run: 50
  output_filename: "events.hepmc"

log_level: "INFO"

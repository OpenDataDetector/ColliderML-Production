# REGRESSION BASELINE (native, colliderml_dev): muon 10 GeV gun, uniform drifting beamspot.
# Same gun parameters + seed as the colliderml-prod-container (pr-4) config, but runs in
# dev's NATIVE environment (cvmfs LCG + bare-metal acts_v4, via dev's default container),
# writing to a distinct dir so it does not clobber the container output.
campaign: "drift_beamspot"
dataset: "single_muon_10GeV"
version: "v1_dev_regression"
stage: "particlegun_generation"

job_config:
  n_runs: 1
  runs_per_node: 1
  time_limit: "00:30:00"
  qos: "interactive"
  execution_mode: "interactive"

events: 10000
seed: 42

particle: "mu-"
energy_min: 10.0
energy_max: 10.0
log_uniform: false
transverse: true

eta_min: -3.0
eta_max: 3.0
phi_min: 0.0
phi_max: 6.28318530718

vertex_uniform: true
vertex_min: [-5.0, -5.0, -200.0, -0.32]
vertex_max: [ 5.0,  5.0,  200.0,  0.32]

debug_output_dir: "/global/cfs/cdirs/m4958/data/ColliderML/simulation/drift_beamspot/single_muon_10GeV/v1_dev_regression/runs/0"
splitting_config:
  enable: false
  n_runs: 1

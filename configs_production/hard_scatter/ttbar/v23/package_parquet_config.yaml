# ttbar v23 (PU0): v22 chain rerun from the tracking stage. Seed finder at the detector field
# (3 T, seed minPt 0.65 GeV; v20-v22 and Release 1 seeded at the ACTS default 2 T), historical
# digitisation seeds, AMVF vertices, shared-hit counts, rows sorted by event_id.
# Generated by scripts/production/make_v23_configs.py from hard_scatter/ttbar/v20/package_parquet_config.yaml.
campaign: "hard_scatter"
dataset: "ttbar"
version: "v23"
stage: "package_parquet"

stage_script_map:
  package_parquet: "postprocessing/package_native_parquet.py"

common:
  container: "localhost/colliderml/sw:pr-8-vtxlinks-20261121b"
  container_tarball: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/images/sw_pr8_vtxlinks_20261121b.tar"
  cache_dir: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/software/colliderml-prod-container/.cache"
  output_base_dir: "/global/cfs/cdirs/m4958/data/ColliderML/staging/simulation"   # = output_base_dir below (run_stage version dir)

job_config:
  n_runs: 11                   # chunks: events 0-999 ... 10000-10239
  runs_per_node: 11
  time_limit: "00:30:00"
  qos: "interactive"
  execution_mode: "interactive"

validation_config:
  enabled: false

input_base_dir: "/global/cfs/cdirs/m4958/data/ColliderML/staging/simulation"
output_base_dir: "/global/cfs/cdirs/m4958/data/ColliderML/staging/simulation"

run_size: 1280
chunk_size: 1000               # same file boundaries as Release 1 hard_scatter/ttbar/v1

objects:
  - tracker_simhits            # Geant4 tracker hits (Daniel 2026-10-01: publish)
  - tracker_hits
  - tracks
  - truth_tracks
  - calo_cells
  - calo_clusters
  - pfos
  - generator_particles        # per-run tables linked from v22 (unchanged)
  - vertices                   # AMVF, from performance_vertexing.root

remap_particle_ids: true       # ACTS 0..N-1 ids -> MCParticle index (Release 1 id)
sim_input_name: edm4hep.root   # per-run symlink to v1, used to build the id map
track_covariance: true         # 5x5 covariance + fit quality from the ROOT summaries
compression: "snappy"
row_group_size: 100000
release_events: 10240         # chunks are cut from the release, not the run dirs
sort_by_event_id: true         # D3: outer rows strictly ascending in event_id
vertex_links: true             # reco/vertices track_ids, track_weights, truth_interaction(_dz)
drop_columns:                  # P-D3: no time measurement in the geometric digitisation
  tracker_hits: [time, var_time]   # true times: truth/tracker_simhits true_time
shared_hits_from_hit_ids: true # n_shared_hits recomputed per event from hit_ids (ACTS leaves it 0)

provenance:
  record: true
  require_pushed_commit: true
  require_approved_sha: true   # HEAD must equal $COLLIDERML_APPROVED_SHA (set by the launcher)
  approved_remote: https://github.com/OpenDataDetector/ColliderML-Production
  approved_ref: origin/release/v23
  commit_marker: false         # .git_commit_success: scripts/production/finalize_version.py after all chunks
  container_json: 'provenance/package_parquet/chunk{unit}_inputs.json'   # files read and written by the chunk

# ttbar v23 (PU0): v22 chain rerun from the tracking stage. Seed finder at the detector field
# (3 T, seed minPt 0.65 GeV; v20-v22 and Release 1 seeded at the ACTS default 2 T), historical
# digitisation seeds, AMVF vertices, shared-hit counts, rows sorted by event_id.
# Generated by scripts/production/make_v23_configs.py from hard_scatter/ttbar/v22/pandora_reco_config.yaml.
campaign: "hard_scatter"
dataset: "ttbar"
version: "v23"
stage: "pandora_reco"

common:
  container: "ghcr.io/opendatadetector/sw:pr-8"
  container_tarball: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/stress_mu200/sw_pr8_image.tar"
  cache_dir: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/software/colliderml-prod-container/.cache"
  output_base_dir: "/global/cfs/cdirs/m4958/data/ColliderML/staging/simulation"
  stage_containers:
    pandora_reco:
      container: "localhost/colliderml/reco:20261106"
      container_tarball: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/images/colliderml_reco_20261106.tar"

job_config:
  n_runs: 8
  runs_per_node: 8
  time_limit: "01:00:00"
  qos: "interactive"
  execution_mode: "interactive"

validation_config:
  enabled: false

events: -1                     # all 1280
processes: 16                  # k4run slices per run; 8 runs x 16 = 128 processes per node
input_name: sim_with_tracks.root
track_collection: ActsTracks   # charged PF
max_track_sigma_pop: 999       # masks the inflated ACTS omega covariance (roadmap A7)
preload_jemalloc: true        # ~14% faster at PU200, identical output (needs image 20261103b or later)
work_root: /pscratch/sd/d/danieltm/colliderml_pandora_work   # per-slice work dirs off CFS (inodes)

provenance:
  record: true
  require_pushed_commit: true
  commit_marker: false
  inputs: [sim_with_tracks.root]
  outputs: ['reco_parts/reco_part_*.root', reco_edm4hep.root]
  image_files: [/opt/k4ODD/k4ODD/options/PandoraSettingsCLD.xml,
                /opt/k4ODD/k4ODD/options/PandoraLikelihoodData9EBin_zuds200.xml]

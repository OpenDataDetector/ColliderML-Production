# v21 (PU0 ttbar, same 10,240 events as v20), step 1 of 2: the complete truth-particle table.
# Every edm4hep MCParticle per event (generator history included) with the raw generator_status /
# simulator_status words, all parent/daughter links, endpoints and colour flow, plus the v1 columns.
# perigee_d0/z0 from the run's ACTS particles.root, vertex_primary from the ACTS particle table.
# Each v21 run dir links edm4hep.root, particles/ and particles.root from v20 runs/<n>.
campaign: "hard_scatter"
dataset: "ttbar"
version: "v21"
stage: "particles_full"

common:
  container: "ghcr.io/opendatadetector/sw:pr-8"
  container_tarball: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/stress_mu200/sw_pr8_image.tar"
  cache_dir: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/software/colliderml-prod-container/.cache"
  output_base_dir: "/global/cfs/cdirs/m4958/data/ColliderML/simulation"

job_config:
  n_runs: 8
  runs_per_node: 8
  time_limit: "00:30:00"
  qos: "interactive"
  execution_mode: "interactive"

validation_config:
  enabled: false

events: -1
sim_input_name: edm4hep.root
native_particles: particles

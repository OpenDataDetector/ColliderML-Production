# Finish the ttH v1 parquet conversion — the remaining 64 of 128 runs.
#
# History: the original convert_all job (53286941, 2026-05-22) was cancelled on
# its 30-minute debug-class wall clock mid-conversion, leaving 64/128 runs
# converted (all four tables agree on the same 64). gen/sim/digi are complete
# (128/128, see validation_reports/) — only this conversion step remained.
# The three top-level failure_report_*_FINAL.txt are stale false alarms.
#
# Changes vs the dataset's configs/convert_all.yaml:
#   - time_limit 30min -> 2h, runs_per_node 5 -> 2 (the old combo couldn't fit)
#   - log_level DEBUG -> INFO (the DEBUG fsspec flood was a real throughput drag)
#   - runs in the sw:pr-8 container (new mechanism; deps verified by
#     tests/regression/test_postprocessing_deps.py — 10/10 in this image)
#   - conversion semantics UNCHANGED: same objects, chunk_size 1000,
#     max_chunks 1 (first 1000 of 1280 events/run — the deliberate original
#     choice), run_size 1280, same column lists.
#
# Shard naming GOTCHA (cost one mis-scoped submission): convert_all names shards
# events<chunk_index*1000>-..., NOT run_size-based. Derive done/missing runs by
# dividing the filename event-start by 1000 (= chunk index = run id).
# True missing set (57 runs) and column lists verified against the original
# dataset config VERBATIM after the guardian caught a schema mismatch
# (my first version dropped 8 tracker_hits columns + tracks/calo keep-lists).

campaign: "hard_scatter"
dataset: "tth"
version: "v1"
stage: "convert_all"

common:
  container: "ghcr.io/opendatadetector/sw:pr-8"
  container_tarball: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/stress_mu200/sw_pr8_image.tar"

job_config:
  n_runs: 128
  runs_per_node: 2
  time_limit: "02:00:00"
  qos: "regular"
  execution_mode: "distributed_slurm"

# --- conversion semantics: VERBATIM from the dataset's configs/convert_all.yaml ---
objects:
- tracker_hits
- tracks
- particles
- calo_hits
output_format: parquet
chunk_size: 1000
run_size: 1280
particles_columns_keep:
- particle_id
- pdg_id
- mass
- energy
- charge
- vx
- vy
- vz
- time
- px
- py
- pz
- perigee_d0
- perigee_z0
- vertex_primary
- parent_id
- primary
digihits_columns_keep:
- x
- y
- z
- true_x
- true_y
- true_z
- time
- particle_id
- detector
- volume_id
- layer_id
- surface_id
tracks_columns_keep:
- d0
- z0
- phi
- theta
- qop
- majority_particle_id
calo_columns_keep:
- event_id
- detector
- cell_id
- total_energy
- x
- y
- z
- contrib_particle_ids
- contrib_energies
- contrib_times
max_chunks: 1
min_tracker_hits: 0
min_calo_hits: 0

log_level: "INFO"

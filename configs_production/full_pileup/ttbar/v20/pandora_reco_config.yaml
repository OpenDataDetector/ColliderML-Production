# Pflow Pilot 1 (v20), PU200, step 2 of 4: Pandora charged particle flow (k4ODD
# ODDreconstruction.py: DDCaloDigi inline + DDPandoraPFANew, CLD settings) on each run's
# sim_with_tracks.root -> reco_edm4hep.root. Physics constants = ODDreconstruction.py
# defaults (the calibrated values in the September brief), no overrides.
campaign: "full_pileup"
dataset: "ttbar"
version: "v20"
stage: "pandora_reco"

common:
  container: "ghcr.io/opendatadetector/sw:pr-8"
  container_tarball: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/stress_mu200/sw_pr8_image.tar"
  cache_dir: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/software/colliderml-prod-container/.cache"
  output_base_dir: "/global/cfs/cdirs/m4958/data/ColliderML/simulation"
  stage_containers:
    pandora_reco:
      container: "localhost/colliderml/reco:20261001"
      container_tarball: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/images/colliderml_reco_20261001.tar"

job_config:
  n_runs: 16
  runs_per_node: 16
  time_limit: "04:00:00"
  qos: "interactive"
  execution_mode: "interactive"

validation_config:
  enabled: false

events: -1                     # all 64
processes: 8                   # 16 runs x 8 = 128 processes; ~8 events each. September rate
                               # 156 ev/node-h -> ~6.6 node-h total: needs 2 nodes in 4 h
input_name: sim_with_tracks.root
track_collection: ActsTracks   # charged PF
max_track_sigma_pop: 999       # masks the inflated ACTS omega covariance (roadmap A7)

# Pflow v22 (PU200): package the hard-scatter generator history (generator_particles_config.yaml, all 1563 runs
# done) into staging/simulation/full_pileup/ttbar/v22/parquet/truth/generator_particles/.
# Same chunks and event_id as the other PU200 v22 objects (run * 64 + ddsim position; chunks 0-999 =
# events 0-99,999, the 100k trim). Ids are the MCParticle index already (no remap). Approved by Daniel 2026-11-21.
campaign: "full_pileup"
dataset: "ttbar"
version: "v22"
stage: "package_parquet"

stage_script_map:
  package_parquet: "postprocessing/package_native_parquet.py"

common:
  container: "ghcr.io/opendatadetector/sw:pr-8"
  container_tarball: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/stress_mu200/sw_pr8_image.tar"
  cache_dir: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/software/colliderml-prod-container/.cache"

job_config:
  n_runs: 1000                 # chunks: events 0-99 ... 99900-99999
  runs_per_node: 16
  time_limit: "00:30:00"
  qos: "debug"
  execution_mode: "interactive"

validation_config:
  enabled: false

input_base_dir: "/global/cfs/cdirs/m4958/data/ColliderML/staging/simulation"
output_base_dir: "/global/cfs/cdirs/m4958/data/ColliderML/staging/simulation"

run_size: 64
chunk_size: 100

objects:
  - generator_particles

remap_particle_ids: false
sim_input_name: edm4hep.root
compression: "snappy"
row_group_size: 100000

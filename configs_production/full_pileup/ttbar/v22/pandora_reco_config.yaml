# Pflow v22 (PU200), step 1 of 3: Pandora rerun on the v20 sim_with_tracks.root with image
# colliderml/reco:20261103 = v20 image + ODD calo layer-data fix (OpenDataDetector PR #6) +
# k4GaudiPandora calo track-state fix (k4GaudiPandora PR #1) + k4ODD settings (k4ODD PR #2:
# CLD electron ID, retrained photon likelihood, refit MIP/had scales, Z0UnmatchedVertexTrackCut 200).
# Constants = ODDreconstruction.py defaults in that k4ODD branch, no overrides.
campaign: "full_pileup"
dataset: "ttbar"
version: "v22"
stage: "pandora_reco"

common:
  container: "ghcr.io/opendatadetector/sw:pr-8"
  container_tarball: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/stress_mu200/sw_pr8_image.tar"
  cache_dir: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/software/colliderml-prod-container/.cache"
  output_base_dir: "/global/cfs/cdirs/m4958/data/ColliderML/simulation"
  stage_containers:
    pandora_reco:
      container: "localhost/colliderml/reco:20261103"
      container_tarball: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/images/colliderml_reco_20261103.tar"

job_config:
  n_runs: 157
  runs_per_node: 1
  time_limit: "04:00:00"
  qos: "interactive"
  execution_mode: "interactive"

validation_config:
  enabled: false

events: -1                     # all 64
processes: 64                  # one event per k4run, one run per node at a time. With 8
                               # processes x 8 events a run did not finish in 20 min (2026-10-01).
merge_slices: false            # podio-merge-files of 64 PU200 events outlasted the reco; keep slices
input_name: sim_with_tracks.root
track_collection: ActsTracks   # charged PF
max_track_sigma_pop: 999       # masks the inflated ACTS omega covariance (roadmap A7)

# ttbar v23 (PU200): v22 chain rerun from the tracking stage. Seed finder at the detector field
# (3 T, seed minPt 0.65 GeV; v20-v22 and Release 1 seeded at the ACTS default 2 T), historical
# digitisation seeds, AMVF vertices, shared-hit counts, rows sorted by event_id.
# Generated by scripts/production/make_v23_configs.py from full_pileup/ttbar/v22/digitization_config.yaml.
campaign: "full_pileup"
dataset: "ttbar"
version: "v23"
stage: "digitization"

common:
  container: "ghcr.io/opendatadetector/sw:pr-8"
  container_tarball: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/stress_mu200/sw_pr8_image.tar"
  cache_dir: "/global/cfs/cdirs/m4958/usr/danieltm/ColliderML/software/colliderml-prod-container/.cache"
  output_base_dir: "/global/cfs/cdirs/m4958/data/ColliderML/staging/simulation"

job_config:
  n_runs: 1563
  runs_per_node: 16
  time_limit: "04:00:00"
  qos: "interactive"
  execution_mode: "interactive"

validation_config:
  enabled: false

events: 64                    # whole Release 1 run
threads: 8
parquet_events_per_shard: 64   # one parquet shard per run
parquet_events_per_row_group: 64   # must not exceed the shard (writer check)

odd_geo_dir: /opt/odd
digi_config: /opt/odd/config/odd-digi-geometric-config.json

output_parquet_arrow: true    # tracker_simhits, tracker_hits, particles, tracks, truth_tracks
digi: true
reco: true
seeding_bfield_tesla: 3.0     # ACTS seed finder field = ODD solenoid (v22 and earlier: ACTS default 2 T)
seed_min_pt_gev: 0.65         # seed-finder minPt (v23_plan README 5b: recovers the high-pT seeding loss at 3 T)
vertexing: true               # AMVF on the ambiguity-resolved tracks -> performance_vertexing.root -> reco/vertices
vertexing_write_track_info: true
digitization_seed_replay:     # D2: the seed string each run had in the version v23 replaces
  - {runs: [0, 15], seed_string: "ttbar_v20_run{run}"}
  - {runs: [16, 1562], seed_string: "ttbar_v22_run{run}"}
num_seeds_per_spm: 40

output_sim_with_tracks: true  # Pandora handoff (calo SimHits + MCParticles + ActsTracks)

output_particles_root: true
output_measurements_root: true
ambi_root_output: true
ambi_finding_performance: true
ambi_fitting_performance: true
write_helix_parameters: true
performance_metrics: true     # CKF summary with cov_* branches (packaging joins them)

truth_tracking: true
truth_tracking_fitter: kf
truth_tracking_prefit: gx2f
truth_tracking_root_summary: true

provenance:                   # per-run record, scripts/cli/run_provenance.py (via run_stage)
  record: true
  require_pushed_commit: true  # refuse to run from a dirty tree or an unpushed commit
  commit_marker: false         # .git_commit_success is written by package_parquet only
  inputs: [edm4hep.root]
  outputs: [digi_provenance.json, timing.csv, sim_with_tracks.root, measurements.root, particles.root,
            tracksummary_ambi.root, tracksummary_truth.root, performance_vertexing.root,
            'tracker_hits/*.parquet', 'tracker_simhits/*.parquet', 'particles/*.parquet',
            'tracks/*.parquet', 'truth_tracks/*.parquet']
  container_json: digi_provenance.json   # field and seed read-back written inside the container

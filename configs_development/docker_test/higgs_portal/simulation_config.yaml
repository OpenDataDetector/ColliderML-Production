# Docker pipeline, Higgs portal: Geant4 simulation of the OpenDataDetector (ddsim)
# Paths are container paths: /output is the output directory, /cache the cache directory.
campaign: "docker_test"
dataset: "higgs_portal"
version: "v1"
stage: "simulation"

common:
  output_base_dir: "/output"

events: 10
input_filename: merged_events.hepmc3
threads: 1
minimalKineticEnergy: 0.1           # GeV, threshold for keeping a particle in the truth record
truthParticleHandler: "Geant4FullTruthParticleHandler"

# The beam spot is applied in the Pythia merge stage, not here.
vertexOffset: [0.0, 0.0, 0.0, 0.0]
vertexSigma: [0.0, 0.0, 0.0, 0.0]

ddsim_printLevel: 4

# Docker pipeline, ttbar: beam-spot smearing of the MadGraph events and pile-up overlay
# Paths are container paths: /output is the output directory, /cache the cache directory.
campaign: "docker_test"
dataset: "ttbar"
version: "v1"
stage: "pythia_generation"

common:
  output_base_dir: "/output"

events: 10
pileup: 0                           # mean number of pile-up interactions per event
merge: true
poisson_sample: true
poisson_buffer_sigma: 5.0

# No hard_process: the hard scatter is the MadGraph output of run 0.
hard_scatter_file: /output/runs/all/0/events.hepmc.gz

vertex_sigma_xy: 0.0125             # mm
vertex_sigma_z: 55.5                # mm
vertex_sigma_t: 0.185               # ns

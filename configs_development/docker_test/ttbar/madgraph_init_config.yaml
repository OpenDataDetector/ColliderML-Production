# Docker pipeline, ttbar: MadGraph process p p > t t~ at NLO (no extra jets)
# Paths are container paths: /output is the output directory, /cache the cache directory.
campaign: "docker_test"
dataset: "ttbar"
version: "v1"
stage: "madgraph_init"

common:
  output_base_dir: "/output"

mg_model: "sm-no_b_mass"
mg_definitions: []
mg_generate_command: |
  generate p p > t t~ [QCD]

mg_base_path: "/opt/mg5"            # link to the MadGraph install, made by docker_stage_env.sh
generation_scratch_dir: "/tmp/mg_scratch"

card_customizations:
  run_card:
    "parton_shower": "PYTHIA8"
    "ebeam1": 7000.0
    "ebeam2": 7000.0
    "ptj": 20.0

  shower_card:
    "Qcut": 40.0
    "time_shower_me_corrections": "F"

  pythia8_card: {}

log_level: "INFO"

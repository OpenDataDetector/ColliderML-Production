# Docker pipeline, ttbar: MadGraph event generation and Pythia8 shower
# Paths are container paths: /output is the output directory, /cache the cache directory.
campaign: "docker_test"
dataset: "ttbar"
version: "v1"
stage: "madgraph_generation"

common:
  output_base_dir: "/output"

events: 10
seed: 42

mg_base_path: "/opt/mg5"            # link to the MadGraph install, made by docker_stage_env.sh
generation_scratch_dir: "/tmp/mg_scratch"

card_customizations:
  run_card:
    "ptj": 20.0
    "event_norm": "sum"

  shower_card:
    "Qcut": 40.0
    "time_shower_me_corrections": "F"

  pythia8_card: {}

splitting_config:
  enable: false                     # all events in one file

log_level: "INFO"
